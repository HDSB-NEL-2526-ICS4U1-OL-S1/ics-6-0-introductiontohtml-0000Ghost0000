<!-- Welcome to your first HTML task! This is an HTML comment... a little different than the // comment we're used to. 

For this task you will create an HTML document with the following features: 

1) Write a short paragraph with the proper tags. 
2) Make some words or passages in the paragraph bold or italic
3) Add a heading or two using an <h> tag (<h1>, etc...)
4) Add an image from the internet of your choosing. 
5) Include a button that will prompt a user for some information of your choosing. 

-->


<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Introduction to HTML</title>
  </head>
  <body>
    <h1>Welcome to My First HTML Page</h1>
    <h2>About Me</h2>

    <p>
      My name is Erich, and I enjoy <b>soccer</b>, <i>music</i>, and learning how to code.
      HTML lets me build cool web pages using <b>tags</b> like these!
    </p>

    <p>
      HTML stands for <b>HyperText Markup Language</b>, and it helps structure what we see on the web.
    </p>

    <img src="soccerball.png" 
         width="150" alt="Soccer Ball">

    <br><br>

    <button type="button" onclick="askUser()">Click Me!</button>

    <script>
      function askUser() {
        let hobby = prompt("What's your favorite hobby?");
        alert("That's awesome! I also like " + hobby + "!");
      }
    </script>
  </body>
</html>
